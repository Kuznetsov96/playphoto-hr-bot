name: Deploy AWS production bot

on:
  # Every input below is a live feature flag: the value chosen here is written straight
  # into the running bot's environment, so a deploy always *sets* every one of them
  # rather than leaving the current ones alone. A value set by hand on the box does not
  # survive the next release.
  #
  # A flag defaults to `true` once that is what production actually runs. While they all
  # defaulted to `false`, opening this form and pressing "Run workflow" without touching
  # the switches would silently turn off canonical schedules, replacements, reminders and
  # preference writes — a routine code deploy would have rolled back half the behaviour.
  # The defaults must therefore track the deployed state, not a first-rollout posture.
  #
  # `scripts/aws/check-production-deploy-contract.mjs` enforces this: every input must
  # default to `true`, and every flag must reach the container through all four links
  # (form → release.env → start-hook export → set_env). Missing one link deploys green,
  # prints `true` in the summary, and starts the bot with the flag off — which is exactly
  # what happened to AWS_REPLACEMENT_AUTO_CONFIRM_ENABLED on its first production deploy.
  #
  # A not-yet-rolled-out flag is therefore held back by UNTICKING it on its first deploy,
  # not by defaulting it to `false`.
  #
  # To disable a flag, untick it deliberately.
  workflow_dispatch:
    inputs:
      schedule_shadow_enabled:
        description: Enable aggregate-only schedule shadow telemetry
        required: true
        type: boolean
        default: true
      canonical_schedule_enabled:
        description: Use canonical backend schedule for the Telegram My Schedule view
        required: true
        type: boolean
        default: true
      schedule_notifications_enabled:
        description: Deliver schedule change notifications to photographers in Telegram
        required: true
        type: boolean
        default: true
      replacements_shadow_enabled:
        description: Enable aggregate-only replacements shadow telemetry
        required: true
        type: boolean
        default: true
      canonical_replacements_enabled:
        description: Use canonical backend replacements for the Telegram replacements flow
        required: true
        type: boolean
        default: true
      reminders_canonical_read_enabled:
        description: Use canonical backend reads for reminder delivery
        required: true
        type: boolean
        default: true
      preferences_canonical_write_enabled:
        description: Write photographer preferences to the canonical backend
        required: true
        type: boolean
        default: true
      replacement_auto_confirm_enabled:
        description: Deliver replacement notifications and the owner revert button
        required: true
        type: boolean
        default: true
      parcels_canonical_read_enabled:
        description: Read Nova Poshta parcels from the canonical backend instead of the bot's own table
        required: true
        type: boolean
        default: true
      # Умолчание `true`, как и у соседей, и это требование контракта
      # (`scripts/aws/check-production-deploy-contract.mjs`): форма переписывает
      # окружение целиком, поэтому флаг с умолчанием `false` превращал бы обычный
      # деплой в тихий откат этой функции.
      #
      # Первый выкат поэтому делается с СНЯТОЙ галочкой — осторожность выражается
      # действием при запуске формы, а не умолчанием в файле.
      access_revocations_enabled:
        description: Revoke Telegram access (channel, hub, support) when an employee is deactivated
        required: true
        type: boolean
        default: true
      # Проводит ли бот выручку в ДДС вебаппа в дополнение к Google-таблице.
      #
      # Булев вход, как требует контракт; строку `FINANCE_DDS_TARGET` для бота
      # выводит `src/config.ts`, а не bash в этом файле. Включённый флаг даёт
      # режим `both`: лист остаётся рабочим, и расхождение между двумя путями
      # видно на реальных данных.
      #
      # Умолчание `true`, как у соседей: форма переписывает окружение целиком,
      # поэтому `false` превращал бы обычный деплой в тихий откат. Флаг ещё не
      # раскатан — первый выкат делается со СНЯТОЙ галочкой.
      dds_api_write_enabled:
        description: Record bot-led location revenue in the webapp cash-flow ledger alongside the Google sheet
        required: true
        type: boolean
        default: true
      # Шлёт ли бот снимок кандидата в вебапп при каждой записи воронки
      # (фаза 1 рекрутинговой миграции). Приёмная сторона уже в проде и
      # идемпотентна, так что повторные пуши безопасны; выключенный флаг —
      # полный no-op, бот ведёт себя как раньше.
      #
      # Умолчание `true`, как у соседей и как требует контракт: форма
      # переписывает окружение целиком, поэтому `false` превращал бы чужой
      # обычный деплой в тихий откат зеркала. Флаг ещё не раскатан — первый
      # выкат делается со СНЯТОЙ галочкой.
      recruiting_mirror_enabled:
        description: Mirror candidate snapshots from the hiring funnel into the webapp recruiting workspace
        required: true
        type: boolean
        default: true
      # Канонические слоты интервью (фаза 2b): кандидатский флоу записи на
      # собеседование читает свободные слоты и бронирует их в вебаппе, а не в
      # локальных таблицах InterviewSlot (с write-through локального зеркала
      # под напоминания). Слоты знакомств/навчання остаются локальными.
      #
      # Умолчание `true`, как у соседей и как требует контракт: форма
      # переписывает окружение целиком, поэтому `false` превращал бы чужой
      # обычный деплой в тихий откат фичи. Флаг ещё не раскатан — первый
      # выкат делается со СНЯТОЙ галочкой.
      recruiting_slots_enabled:
        description: Book candidate interview slots through the webapp canonical slot API
        required: true
        type: boolean
        default: true
      # Команды рекрутёра (фаза 3a): бот опрашивает outbox вебаппа
      # (/recruiting/commands/pending) и применяет решения рекрутёра своей
      # воронкой — теми же вызовами hr-service, что и кнопки HR-меню.
      #
      # Умолчание `true`, как у соседей и как требует контракт: форма
      # переписывает окружение целиком, поэтому `false` превращал бы чужой
      # обычный деплой в тихий откат фичи. Флаг ещё не раскатан — первый
      # выкат делается со СНЯТОЙ галочкой.
      recruiting_commands_enabled:
        description: Apply recruiter commands from the webapp through the bot funnel
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: playphoto-production-bot
  cancel-in-progress: false

jobs:
  quality:
    name: Verify bot release candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/test_db"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: test
      BOT_TOKEN: "123456:ABC-DEF"
      SUPPORT_CHAT_ID: -10012345678
      RECOVERY_CHAT_ID: -10012345678
      TEAM_HUB_CHAT_ID: -10012345678
      TEAM_CHANNEL_ID: -10012345678
      ADMIN_IDS: 12345678
      CO_FOUNDER_IDS: 12345678
      SUPPORT_IDS: 12345678
      MENTOR_IDS: 12345678
      HR_IDS: 12345678
      FINANCE_IDS: 12345678
      SPREADSHEET_ID_TEAM: dummy
      SPREADSHEET_ID_SCHEDULE: dummy
      SPREADSHEET_ID_DDS: dummy
      SPREADSHEET_ID_TECH_CASH: dummy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Validate database migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run build
      - run: npm run check-cycles
      - run: npm run check-menu-ids
      - run: npm run check-production-deploy
      - run: npm test

  build:
    name: Build, scan and publish ARM64 image
    needs: quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      REPOSITORY: playphoto-staging-bot
      IMAGE_TAG: git-${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure short-lived AWS build credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BOT_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: PlayPhotoProductionBotBuild
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Find an existing immutable image
        id: existing
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          [[ "$digest" == sha256:* ]] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push the production bot image
        id: image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=playphoto-production-bot-arm64
          cache-to: type=gha,mode=max,scope=playphoto-production-bot-arm64
      - name: Block vulnerable images
        run: scripts/aws/check-ecr-scan.sh "$REPOSITORY" "$IMAGE_TAG"
      - name: Record immutable image digest
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DIGEST: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
        run: |
          [[ "$DIGEST" == sha256:* ]] || { echo "Missing immutable image digest." >&2; exit 1; }
          install -d "${RUNNER_TEMP}/release"
          printf '%s\n' "${REGISTRY}/${REPOSITORY}@${DIGEST}" > "${RUNNER_TEMP}/release/bot.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-bot-image
          path: ${{ runner.temp }}/release/bot.txt
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Transfer secrets and deploy live bot
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      RUNTIME_SECRET_ID: playphoto/production/bot-runtime
      CODEDEPLOY_APPLICATION: playphoto-production-bot
      CODEDEPLOY_GROUP: playphoto-production-bot

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure short-lived AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BOT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: PlayPhotoProductionBotDeploy
      - name: Transfer existing GitHub runtime secrets into AWS
        env:
          DOCKER_ENV: ${{ secrets.DOCKER_ENV }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RECOVERY_CHAT_ID: ${{ secrets.RECOVERY_CHAT_ID }}
        run: |
          umask 077
          printf '%s' "$DOCKER_ENV" > "${RUNNER_TEMP}/docker.env"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "${RUNNER_TEMP}/google.json"
          jq -e . "${RUNNER_TEMP}/google.json" >/dev/null
          if ! aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_ID" \
            --query SecretString \
            --output text > "${RUNNER_TEMP}/current.json" 2>/dev/null
          then
            printf '{}\n' > "${RUNNER_TEMP}/current.json"
          fi
          jq -e 'type == "object"' "${RUNNER_TEMP}/current.json" >/dev/null
          jq -n \
            --slurpfile current "${RUNNER_TEMP}/current.json" \
            --rawfile dockerEnv "${RUNNER_TEMP}/docker.env" \
            --rawfile googleServiceAccountJson "${RUNNER_TEMP}/google.json" \
            --arg recoveryChatId "$RECOVERY_CHAT_ID" \
            '($current[0] // {}) + {
              dockerEnv: $dockerEnv,
              googleServiceAccountJson: $googleServiceAccountJson,
              recoveryChatId: $recoveryChatId
            }' > "${RUNNER_TEMP}/next.json"
          aws secretsmanager put-secret-value \
            --secret-id "$RUNTIME_SECRET_ID" \
            --secret-string "file://${RUNNER_TEMP}/next.json" >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-bot-image
          path: ${{ runner.temp }}/release
      - name: Build immutable live revision
        id: revision
        run: |
          BOT_IMAGE="$(<"${RUNNER_TEMP}/release/bot.txt")"
          [[ "$BOT_IMAGE" == *@sha256:* ]] || { echo "Bot image is not immutable." >&2; exit 1; }
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          artifact_bucket="playphoto-production-bot-deployments-${account_id}"
          artifact_key="releases/${GITHUB_SHA}/${GITHUB_RUN_ATTEMPT}.zip"
          revision_directory="${RUNNER_TEMP}/playphoto-bot-revision"
          revision_archive="${RUNNER_TEMP}/playphoto-bot-${GITHUB_SHA}.zip"
          install -d "${revision_directory}/hooks" "${revision_directory}/scripts/aws"
          install -m 0644 deploy/aws/appspec.yml "${revision_directory}/appspec.yml"
          install -m 0644 compose.aws.yaml "${revision_directory}/compose.aws.yaml"
          install -m 0644 compose.aws.live.yaml "${revision_directory}/compose.aws.live.yaml"
          install -m 0755 deploy/aws/hooks/*.sh "${revision_directory}/hooks/"
          install -m 0755 \
            scripts/aws/deploy-production-bot.sh \
            scripts/aws/set-production-mode.sh \
            "${revision_directory}/scripts/aws/"
          {
            printf 'AWS_REGION=%q\n' "$AWS_REGION"
            printf 'RUNTIME_SECRET_ID=%q\n' "$RUNTIME_SECRET_ID"
            printf 'BOT_RUNTIME_MODE=%q\n' live
            printf 'AWS_SCHEDULE_SHADOW_READ_ENABLED=%q\n' "${{ inputs.schedule_shadow_enabled }}"
            printf 'AWS_SCHEDULE_CANONICAL_READ_ENABLED=%q\n' "${{ inputs.canonical_schedule_enabled }}"
            printf 'AWS_SCHEDULE_NOTIFICATIONS_ENABLED=%q\n' "${{ inputs.schedule_notifications_enabled }}"
            printf 'AWS_REPLACEMENTS_SHADOW_ENABLED=%q\n' "${{ inputs.replacements_shadow_enabled }}"
            printf 'AWS_REPLACEMENTS_CANONICAL_ENABLED=%q\n' "${{ inputs.canonical_replacements_enabled }}"
            printf 'AWS_REMINDERS_CANONICAL_READ_ENABLED=%q\n' "${{ inputs.reminders_canonical_read_enabled }}"
            printf 'AWS_PREFERENCES_CANONICAL_WRITE_ENABLED=%q\n' "${{ inputs.preferences_canonical_write_enabled }}"
            printf 'AWS_REPLACEMENT_AUTO_CONFIRM_ENABLED=%q\n' "${{ inputs.replacement_auto_confirm_enabled }}"
            printf 'AWS_PARCELS_CANONICAL_READ_ENABLED=%q\n' "${{ inputs.parcels_canonical_read_enabled }}"
            printf 'AWS_ACCESS_REVOCATIONS_ENABLED=%q\n' "${{ inputs.access_revocations_enabled }}"
            printf 'AWS_DDS_API_WRITE_ENABLED=%q\n' "${{ inputs.dds_api_write_enabled }}"
            printf 'AWS_RECRUITING_MIRROR_ENABLED=%q\n' "${{ inputs.recruiting_mirror_enabled }}"
            printf 'AWS_RECRUITING_SLOTS_ENABLED=%q\n' "${{ inputs.recruiting_slots_enabled }}"
            printf 'AWS_RECRUITING_COMMANDS_ENABLED=%q\n' "${{ inputs.recruiting_commands_enabled }}"
            printf 'LIVE_SAFE_ROLLBACK_VERSION=%q\n' 1
            printf 'BOT_IMAGE=%q\n' "$BOT_IMAGE"
            printf 'GIT_SHA=%q\n' "$GITHUB_SHA"
          } > "${revision_directory}/release.env"
          (cd "$revision_directory" && zip -qr "$revision_archive" .)
          aws s3 cp "$revision_archive" "s3://${artifact_bucket}/${artifact_key}" --only-show-errors
          echo "bucket=${artifact_bucket}" >> "$GITHUB_OUTPUT"
          echo "key=${artifact_key}" >> "$GITHUB_OUTPUT"
      - name: Detect a live-safe CodeDeploy rollback baseline
        id: rollback_baseline
        run: |
          safe=false
          deployment_id="$(aws deploy get-deployment-group \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --query 'deploymentGroupInfo.lastSuccessfulDeployment.deploymentId' \
            --output text)"
          if [[ "$deployment_id" == d-* ]]; then
            bucket="$(aws deploy get-deployment \
              --deployment-id "$deployment_id" \
              --query 'deploymentInfo.revision.s3Location.bucket' \
              --output text)"
            key="$(aws deploy get-deployment \
              --deployment-id "$deployment_id" \
              --query 'deploymentInfo.revision.s3Location.key' \
              --output text)"
            previous_archive="${RUNNER_TEMP}/previous-bot-revision.zip"
            previous_release="${RUNNER_TEMP}/previous-release.env"
            if [[ "$bucket" != "None" && "$key" != "None" ]] && \
              aws s3 cp "s3://${bucket}/${key}" "$previous_archive" --only-show-errors && \
              unzip -p "$previous_archive" release.env >"$previous_release" && \
              grep -qx 'LIVE_SAFE_ROLLBACK_VERSION=1' "$previous_release" && \
              grep -qx 'BOT_RUNTIME_MODE=live' "$previous_release"
            then
              safe=true
            fi
          fi
          echo "safe=${safe}" >> "$GITHUB_OUTPUT"
          echo "Live-safe rollback baseline available: ${safe}"
      - name: Start live CodeDeploy release
        id: deployment
        env:
          ARTIFACT_BUCKET: ${{ steps.revision.outputs.bucket }}
          ARTIFACT_KEY: ${{ steps.revision.outputs.key }}
          LIVE_SAFE_BASELINE: ${{ steps.rollback_baseline.outputs.safe }}
          SCHEDULE_SHADOW_ENABLED: ${{ inputs.schedule_shadow_enabled }}
          CANONICAL_SCHEDULE_ENABLED: ${{ inputs.canonical_schedule_enabled }}
        run: |
          rollback_override=()
          if [[ "$LIVE_SAFE_BASELINE" != "true" ]]; then
            [[ "$SCHEDULE_SHADOW_ENABLED" == "false" && "$CANONICAL_SCHEDULE_ENABLED" == "false" ]] || {
              echo "Bootstrap live-safe deployment requires schedule migration flags to remain disabled." >&2
              exit 1
            }
            # The currently installed revisions predate live-safe rollback and are labelled
            # standby even though the container is live. The lifecycle hooks capture and restore
            # the real runtime for this one bootstrap deployment. After it succeeds, normal
            # CodeDeploy automatic rollback is safe again.
            rollback_override=(--auto-rollback-configuration enabled=false)
          fi
          deployment_id="$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --description "PlayPhoto production bot live ${GITHUB_SHA}" \
            --revision "revisionType=S3,s3Location={bucket=${ARTIFACT_BUCKET},key=${ARTIFACT_KEY},bundleType=zip}" \
            --file-exists-behavior OVERWRITE \
            "${rollback_override[@]}" \
            --query deploymentId \
            --output text)"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
      - name: Wait for health validation and automatic rollback
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          if ! aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"; then
            aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" --output json
            exit 1
          fi
      - name: Write deployment summary
        run: |
          {
            echo '### AWS production bot live deployment succeeded'
            echo
            echo '- Telegram polling: **live**'
            echo '- Business source: AWS API'
            echo '- Schedule shadow telemetry: `${{ inputs.schedule_shadow_enabled }}`'
            echo '- Canonical schedule read: `${{ inputs.canonical_schedule_enabled }}`'
            echo '- Replacements shadow telemetry: `${{ inputs.replacements_shadow_enabled }}`'
            echo '- Canonical replacements: `${{ inputs.canonical_replacements_enabled }}`'
            echo '- Canonical reminders read: `${{ inputs.reminders_canonical_read_enabled }}`'
            echo '- Canonical preferences write: `${{ inputs.preferences_canonical_write_enabled }}`'
            echo '- Replacement auto-confirm delivery: `${{ inputs.replacement_auto_confirm_enabled }}`'
            echo '- Parcels canonical read: `${{ inputs.parcels_canonical_read_enabled }}`'
            echo '- Access revocations: `${{ inputs.access_revocations_enabled }}`'
            echo '- DDS API revenue write: `${{ inputs.dds_api_write_enabled }}`'
            echo '- Recruiting candidate mirror: `${{ inputs.recruiting_mirror_enabled }}`'
            echo '- Recruiting canonical interview slots: `${{ inputs.recruiting_slots_enabled }}`'
            echo '- Recruiting webapp commands: `${{ inputs.recruiting_commands_enabled }}`'
            echo '- Previous live-safe rollback baseline: `${{ steps.rollback_baseline.outputs.safe }}`'
            echo '- Commit: `'$GITHUB_SHA'`'
            echo '- CodeDeploy: `${{ steps.deployment.outputs.deployment_id }}`'
          } >> "$GITHUB_STEP_SUMMARY"
