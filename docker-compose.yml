services:
  bot:
    # Local build context for development
    build: .
    # Use pre-built image for production
    image: ghcr.io/kuznetsov96/playphoto-hr-bot:latest
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
        monitor: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ./logs:/app/logs
      - ./google-service-account.json:/app/google-service-account.json

  loki:
    image: grafana/loki:3.4.2
    restart: always
    command: -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./ops/logging/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost:3100/ready" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.14.0
    restart: always
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./ops/logging/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/playphoto:ro
      - alloy_data:/var/lib/alloy/data
    healthcheck:
      test: [ "CMD", "alloy", "validate", "/etc/alloy/config.alloy" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-playphoto_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-playphoto_bot}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: [ "redis-server" ]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
  loki_data:
  alloy_data:
